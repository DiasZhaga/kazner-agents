[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kazner-agents"
version = "0.1.0"
description = "Multi-agent annotation system for Kazakh named-entity recognition"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "openai>=2.0",
    "requests>=2.31",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
kna = "kazner_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kazner_agents = ["data/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
